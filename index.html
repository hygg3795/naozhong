<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>孤光 闹钟</title><style>:root{--primary-color:#00ff88;--bg-color:#1a1a1a;--panel-color:#2d2d2d;--text-color:#fff;--display-bg:#000;--transition-speed:.6s}[data-theme="light"]{--bg-color:#f0f2f5;--panel-color:#fff;--text-color:#333;--display-bg:#222}body{background-color:var(--bg-color);color:var(--text-color);font-family:'Segoe UI',sans-serif;margin:0;height:100vh;overflow:hidden;transition:background-color:.4s}.theme-toggle{position:fixed;top:20px;right:20px;cursor:pointer;font-size:24px;z-index:1000;background:var(--panel-color);padding:10px;border-radius:50%;box-shadow:0 4px 10px rgba(0,0,0,.2)}.app-container{position:relative;width:100vw;height:100vh}.box{position:absolute;transition:all var(--transition-speed) cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.2);background:var(--panel-color);padding:20px;cursor:pointer}#mainTimerBox{width:320px;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10}#beijingTimeBox{width:180px;top:20px;left:20px;z-index:5;padding:15px;background:rgba(0,0,0,.1)}.swapped #mainTimerBox{width:140px;top:20px;left:20px;transform:translate(0,0)}.swapped #beijingTimeBox{width:320px;top:50%;left:50%;transform:translate(-50%,-50%)}.display{font-family:'Courier New',monospace;background:var(--display-bg);color:var(--primary-color);padding:10px;border-radius:10px;width:90%;text-align:center;margin:10px 0;box-sizing:border-box}#bjDateDisplay{font-size:.8rem;color:var(--primary-color);margin-bottom:-5px}#bjTimeDisplay{font-size:1.5rem}#timerDisplay{font-size:2.5rem}.swapped #bjTimeDisplay{font-size:2.5rem}.swapped #bjDateDisplay{font-size:1.2rem;margin-bottom:5px}.swapped #timerDisplay{font-size:1.2rem}.label{font-size:.8rem;opacity:.8;margin-bottom:5px}.controls{display:flex;gap:5px;margin-bottom:15px}.swapped .controls,.swapped .action-btns{display:none}input{width:50px;padding:8px;text-align:center;border-radius:5px;border:none;background:var(--bg-color);color:var(--text-color)}button{padding:10px 20px;border:none;border-radius:20px;cursor:pointer;font-weight:bold;margin:0 5px}.start-btn{background:var(--primary-color);color:#000}.reset-btn{background:#d41c1c;color:#fff}@media (max-width:480px){#mainTimerBox{width:85%}.swapped #beijingTimeBox{width:85%}}</style></head><body data-theme="dark"><div class="theme-toggle" onclick="toggleTheme()">☀️</div><div class="app-container" id="container"><div id="beijingTimeBox" class="box" onclick="handleSwap(event)"><div class="label">标准北京时间</div><div id="bjDateDisplay">加载校准中...</div><div id="bjTimeDisplay" class="display">00:00:00</div></div><div id="mainTimerBox" class="box" onclick="handleSwap(event)"><div class="label">倒计时闹钟</div><div id="timerDisplay" class="display">00:00:00</div><div class="controls" onclick="event.stopPropagation()"><input type="number" id="hrs" placeholder="时" min="0"><input type="number" id="mins" placeholder="分" min="0" max="59"><input type="number" id="secs" placeholder="秒" min="0" max="59"></div><div class="action-btns" onclick="event.stopPropagation()"><button class="start-btn" id="toggleBtn">开始</button><button class="reset-btn" onclick="resetAll()">重置</button></div></div></div><script>let currentServerTimestamp=0;async function initNetworkTime(){try{const response=await fetch('https://api.m.taobao.com/rest/api3.do?api=mtop.common.getTimestamp');const resData=await response.json();currentServerTimestamp=parseInt(resData.data.t);runClock()}catch(e){currentServerTimestamp=Date.now();runClock();document.querySelector('.label').textContent="北京时间"}}function runClock(){setInterval(()=>{currentServerTimestamp+=1000;renderBJTime()},1000)}function renderBJTime(){const dateObj=new Date(currentServerTimestamp);const y=dateObj.getFullYear();const m=String(dateObj.getMonth()+1).padStart(2,'0');const d=String(dateObj.getDate()).padStart(2,'0');const hh=String(dateObj.getHours()).padStart(2,'0');const mm=String(dateObj.getMinutes()).padStart(2,'0');const ss=String(dateObj.getSeconds()).padStart(2,'0');document.getElementById('bjDateDisplay').textContent=`${y}年${m}月${d}日`;document.getElementById('bjTimeDisplay').textContent=`${hh}:${mm}:${ss}`}initNetworkTime();function handleSwap(e){if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;document.getElementById('container').classList.toggle('swapped')}function toggleTheme(){const body=document.body;const btn=document.querySelector('.theme-toggle');const isDark=body.getAttribute('data-theme')==='dark';body.setAttribute('data-theme',isDark?'light':'dark');btn.textContent=isDark?'🌙':'☀️';btn.style.color=isDark?'black':'white'}let totalSeconds=0;let timerInterval;let isAlarming=false;let audioCtx,currentAlarm;function startAlarmSound(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.type='square';osc.frequency.setValueAtTime(880,audioCtx.currentTime);gain.gain.setValueAtTime(0.5,audioCtx.currentTime);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();return{osc}}document.getElementById('toggleBtn').onclick=function(){if(isAlarming){if(currentAlarm)currentAlarm.osc.stop();isAlarming=false;resetAll();return}if(timerInterval){clearInterval(timerInterval);timerInterval=null;this.textContent="继续"}else{const h=parseInt(document.getElementById('hrs').value)||0;const m=parseInt(document.getElementById('mins').value)||0;const s=parseInt(document.getElementById('secs').value)||0;if(totalSeconds<=0)totalSeconds=h*3600+m*60+s;if(totalSeconds<=0)return;this.textContent="暂停";timerInterval=setInterval(()=>{totalSeconds--;updateTimerUI();if(totalSeconds<=0){clearInterval(timerInterval);isAlarming=true;this.textContent="停止响铃";this.className="reset-btn";currentAlarm=startAlarmSound()}},1000)}}function updateTimerUI(){const h=Math.floor(totalSeconds/3600);const m=Math.floor((totalSeconds%3600)/60);const s=totalSeconds%60;document.getElementById('timerDisplay').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function resetAll(){clearInterval(timerInterval);timerInterval=null;totalSeconds=0;updateTimerUI();const btn=document.getElementById('toggleBtn');btn.textContent="开始";btn.className="start-btn"}</script></body></html>
